{% extends "base.html" %}

{% block title %}
Удаление товара | SportStore
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card">
            <div class="card-body">

                <h1 class="mb-4">Удаление товара</h1>

                <p class="lead">
                    Вы действительно хотите удалить товар
                    «{{ product.name }}»?
                </p>

                <form method="post">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Удалить
                    </button>

                    <a
                        href="{% url 'product_detail' product.pk %}"
                        class="btn btn-secondary"
                    >
                        Отмена
                    </a>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
