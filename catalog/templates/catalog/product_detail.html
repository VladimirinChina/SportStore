{% extends "base.html" %}

{% block title %}
{{ product.name }} | SportStore
{% endblock %}

{% block content %}

<div class="row">
    <div class="col-md-6">
        {% if product.image %}
            <img src="{{ product.image.url }}"
                 class="img-fluid rounded"
                 alt="{{ product.name }}">
        {% endif %}
    </div>

    <div class="col-md-6">
        <h1>{{ product.name }}</h1>

        <p class="lead">
            {{ product.description }}
        </p>

        <h3>{{ product.price }} ₽</h3>

        <p class="text-muted">
            Категория: {{ product.category.name }}
        </p>

        <a href="{% url 'home' %}" class="btn btn-dark">
            ← Вернуться к товарам
        </a>
    </div>
</div>

{% endblock %}
