[project]
name = "sportstore"
version = "0.1.0"
description = ""
authors = [
    {name = "vladimir",email = "vladimirinchina@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django (>=6.0.8,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.black]
line_length = 119
exclude = '''
/(
    \.git
  | \.venv
)/
'''


[tool.isort]
line_length = 119

[tool.mypy]
python_version = "3.13"
# mypy_path = "src"
disallow_untyped_defs = true
warn_return_any = true
exclude = ['tests', '.venv', 'venv']
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 119
exclude = [".venv", ".git", "__pycache__"]

[tool.poetry]
package-mode = false
