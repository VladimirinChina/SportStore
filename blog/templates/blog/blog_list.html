{% extends "base.html" %}

{% block title %}
Блог
{% endblock %}

{% block content %}

<h1>Блог</h1>

{% for blog in blogs %}
    <div>
        <h2>{{ blog.title }}</h2>
        <p>{{ blog.content|truncatechars:200 }}</p>
    </div>
{% empty %}
    <p>Опубликованных статей пока нет.</p>
{% endfor %}

{% endblock %}
