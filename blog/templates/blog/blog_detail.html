{% extends "base.html" %}

{% block title %}
{{ blog.title }}
{% endblock %}

{% block content %}

<h1>{{ blog.title }}</h1>

{% if blog.preview %}
    <img
        src="{{ blog.preview.url }}"
        class="img-fluid mb-3"
        alt="{{ blog.title }}"
    >
{% endif %}

<p class="text-muted">
    Просмотров: {{ blog.views_count }}
</p>

<div>
    {{ blog.content }}
</div>

<a href="{% url 'blog_list' %}" class="btn btn-secondary mt-3">
    Назад к списку статей
</a>

<a
    href="{% url 'blog_update' blog.pk %}"
    class="btn btn-dark mt-3"
>
    Редактировать
</a>

<a
    href="{% url 'blog_delete' blog.pk %}"
    class="btn btn-danger mt-3"
>
    Удалить
</a>

{% endblock %}
