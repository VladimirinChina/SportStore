{% extends "base.html" %}

{% block title %}
Удаление статьи
{% endblock %}

{% block content %}

<h1>Удаление статьи</h1>

<p>
    Вы действительно хотите удалить статью
    «{{ blog.title }}»?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Удалить
    </button>

    <a
        href="{% url 'blog_detail' blog.pk %}"
        class="btn btn-secondary"
    >
        Отмена
    </a>
</form>

{% endblock %}
